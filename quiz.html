<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國語期中考語音互動複習</title><style>
:root{--bg:#f5fbff;--card:#fff;--ink:#17324d;--accent:#2a6f97;--soft:#dceef8;--ok:#1b7f5c;--bad:#b23a48;--warn:#fff2b8}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:920px;margin:auto;padding:20px}h1{font-size:34px;margin:4px 0 8px;text-align:center}.sub{font-size:20px;text-align:center;margin-bottom:16px;line-height:1.55}.topbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}.pill{background:var(--soft);padding:9px 15px;border-radius:999px;font-size:18px;font-weight:700}.card{background:var(--card);border-radius:22px;padding:26px;box-shadow:0 8px 28px rgba(39,78,108,.12)}.part{font-size:23px;color:var(--accent);font-weight:900;margin-bottom:9px}.qnum{font-size:20px;font-weight:700;margin-bottom:8px}.hint{display:inline-block;background:var(--warn);border-radius:999px;padding:6px 12px;font-size:18px;font-weight:800;margin:2px 0 12px}.qrow{display:flex;align-items:flex-start;gap:12px}.question{font-size:29px;line-height:1.5;font-weight:800;flex:1}button{font-family:inherit}.speak{border:0;background:#fff3c4;border-radius:14px;font-size:24px;padding:10px 14px;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.08)}.options{margin-top:20px;display:grid;gap:13px}.opt{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:3px solid #c9dce8;background:#fff;border-radius:18px;padding:15px}.optbutton{border:0;background:transparent;text-align:left;font-size:25px;line-height:1.45;font-weight:700;color:var(--ink);cursor:pointer;padding:4px;width:100%}.opt.selected{border-color:var(--accent);background:#eaf6fc}.opt.correct{border-color:var(--ok);background:#e9f8f1}.opt.wrong{border-color:var(--bad);background:#fff0f2}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}.check,.next,.start,.restart{border:0;color:#fff;font-size:23px;font-weight:800;padding:13px 25px;border-radius:16px;cursor:pointer}.check{background:#d97706}.next,.start,.restart{background:var(--accent)}.next{display:none}.feedback{min-height:42px;font-size:24px;font-weight:800;margin-top:16px;text-align:center;line-height:1.5}.intro ul{font-size:21px;line-height:1.8;max-width:720px;margin:12px auto}.start,.restart{display:block;margin:22px auto 0}.result{text-align:center;display:none}.score{font-size:48px;font-weight:900;color:var(--accent);margin:10px 0}.small{font-size:18px;color:#4b6475;line-height:1.6}.progress{height:14px;background:#d8e8f1;border-radius:999px;overflow:hidden;margin:12px 0 20px}.bar{height:100%;width:0;background:#5fa8d3;transition:width .25s ease}.home{text-align:center;margin:0 0 12px;font-size:17px}.home a{color:var(--accent);font-weight:700;text-decoration:none}@media(max-width:620px){.wrap{padding:12px}.card{padding:18px}.question{font-size:25px}.optbutton{font-size:22px}h1{font-size:28px}.sub{font-size:18px}.pill{font-size:16px}}
</style></head><body><div class="wrap"><div class="home"><a href="./">← 回到期中考複習首頁</a></div><h1 id="title"></h1><div class="sub">期中考語音互動複習<br>題目和每個選項都可以按 🔊 聽語音</div><div class="topbar"><div class="pill" id="total"></div><div class="pill" id="rc"></div><div class="pill" id="vc"></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="card intro" id="intro"><div class="part">準備開始</div><ul><li>先按 🔊 聽題目。</li><li>每個答案旁邊也有 🔊，不會讀字也沒關係。</li><li>有些題目可以複選，畫面會提醒你。</li><li>選好答案後，按「確認答案」。</li></ul><button class="start" onclick="startQuiz()">開始作答</button></div><div class="card" id="quiz" style="display:none"><div class="part" id="part"></div><div class="qnum" id="qnum"></div><div class="hint" id="hint" style="display:none">本題可以複選</div><div class="qrow"><div class="question" id="question"></div><button class="speak" id="speakQ">🔊</button></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="check" id="checkBtn" onclick="checkAnswer()">確認答案</button><button class="next" id="nextBtn" onclick="nextQuestion()">下一題</button></div></div><div class="card result" id="result"><div class="part">完成囉！</div><div class="score" id="score"></div><div class="question" style="font-size:27px">你完成這一課全部複習了！</div><p class="small">可以再做一次，看看能不能比剛才更進步。</p><button class="restart" onclick="restartQuiz()">再做一次</button></div></div><script>
const LESSONS={"2":{"title":"放學後","reading":[["每天放學的時候，作者總是怎麼回家？",["慢慢走回家","飛也似的趕回家","搭飛機回家"],[1]],["回到家後，常有什麼對著大家招招手？",["美味的點心","很多作業","新的玩具"],[0]],["課文中出現哪些點心？（可以複選）",["奶油餅乾","千層糕","紅豆湯","漢堡"],[0,1,2]],["朋友們一坐下來，常常把眼前的美食怎麼樣？",["一掃而空","放到明天","全部丟掉"],[0]],["作者最重要的精神食糧是什麼？",["國語日報","漫畫玩具","電視遊戲"],[0]],["作者和姐姐最後想出什麼看報紙的方法？",["一人看一邊","把報紙撕掉","都不要看"],[0]],["寫完功課後，作者和大家會去哪裡玩？",["附近的公園","醫院","電影院"],[0]],["作者和朋友會玩哪些遊戲？（可以複選）",["警察抓小偷","跳繩","游泳"],[0,1]],["玩到太陽快下山時，大人會呼喊什麼？",["回家吃晚餐了！","快去睡覺！","快去上學！"],[0]],["作者希望時間可以怎麼樣？",["暫停","快一點過去","全部消失"],[0]]],"vocab":[["食糧","泛指米穀及食物。"],["姐姐","稱同父母所生而比自己年長的女性。"],["爭吵","爭鬥吵鬧。"],["警察","維持公共秩序、保護民眾安全的人。"],["小偷","竊賊，偷東西的人。"],["跳繩","一種跳過繩子的運動或遊戲。"],["依依不捨","非常留戀、捨不得。"],["結束","終結、了結。"],["暫停","進行中短時間停止。"],["幸福","生活或境遇圓滿愉快。"]]},"3":{"title":"我的籃球夢","reading":[["一開始，空心進籃時，全場怎麼樣？",["歡聲四起","非常安靜","立刻下雨"],[0]],["剛開學時，同學邀請作者一起加入什麼社團？",["籃球社","美術社","直笛社"],[0]],["作者一開始覺得自己的運動神經怎麼樣？",["很好","不好","完全不用練習"],[1]],["初次站在球場，作者覺得籃球架像什麼？",["遙不可及的高山","小小的椅子","好吃的點心"],[0]],["學長鼓勵作者：「熟能生巧」，只要努力多練習，就會怎麼樣？",["一定會進步","一定會放棄","一定會遲到"],[0]],["一開始學運球時，球曾經反彈撞到作者哪裡？",["下巴","膝蓋","書包"],[0]],["為了實現夢想，作者怎麼做？",["最早到球場練習","躲在教室睡覺","把球丟掉"],[0]],["比賽結束前幾秒，作者帶著緊張的心情上場？",["五秒","五分鐘","五小時"],[0]],["同伴拍拍作者的肩膀說什麼？",["你可以的，加油！","你不要上場！","你趕快回家！"],[0]],["作者把手中的籃球以什麼線條拋出？",["優美的弧線","直直的木棍","亂七八糟的線"],[0]]],"vocab":[["邀約","邀請、約請。"],["遙不可及","距離很遠，或覺得很難做到。"],["熟能生巧","練習久了，就會變得更熟練。"],["反彈","碰到東西後又彈回來。"],["不曾","從來沒有。"],["指揮","指示或控制行動。"],["此起彼落","一個接一個，連續不斷。"],["喧鬧","聲音很多，很吵鬧。"],["優美","美好、好看。"],["弧線","彎彎的線條。"]]},"4":{"title":"永遠的馬偕","reading":[["馬偕來自哪一個國家？",["加拿大","日本","美國"],[0]],["馬偕在臺灣除了傳教，還做了哪些事？",["興建醫院、創辦學校","開餐廳、賣玩具","蓋球場、辦比賽"],[0]],["馬偕完成哪些課程後，自願到海外傳福音？",["醫療和神學院","美術和音樂","體育和電腦"],[0]],["馬偕陪居民做什麼，並告訴大家居家衛生的重要？",["清水溝、除草","唱歌跳舞","打球跑步"],[0]],["各地的人們聽說有治病的良方後，怎麼做？",["翻山越嶺趕來求助","立刻回家睡覺","把藥品丟掉"],[0]],["熱心的地方人士如何幫助馬偕？",["捐錢讓他做更多善事","叫他離開臺灣","阻止他創辦學校"],[0]],["馬偕在淡水興建北臺灣第一間什麼醫院？",["西式醫院","動物醫院","玩具醫院"],[0]],["馬偕創辦新式學校，是為了讓誰有讀書的機會？",["孩子","動物","遊客"],[0]],["馬偕又成立女學堂，讓誰也有就學機會？",["女子","只有醫師","只有商人"],[0]],["馬偕常常披星戴月，走訪哪裡？",["山區和鄉村","百貨公司","遊樂園"],[0]]],"vocab":[["醫院","診治或看護病人的機構。"],["生命","生物生存的壽命，也可表示有生氣。"],["奉獻","把自己的力量、時間或心力貢獻出來。"],["醫療","醫治和照顧病人的過程。"],["衛生","預防疾病、保持清潔和健康。"],["藥品","可以用來防治疾病的物質。"],["治病","治療疾病，使身體恢復健康。"],["捐錢","捐出金錢幫助別人。"],["食宿","飲食和住宿。"],["學堂","以前學生受教育的場所，相當於學校。"]]},"5":{"title":"假如給我三天光明","reading":[["海倫．凱勒小時候因為生病，後來發生什麼事？",["失明又失聰","搬到森林","成為醫師"],[0]],["她認為短暫失去光明，可能讓人更懂得什麼？",["珍惜光明","討厭黑暗","停止旅行"],[0]],["朋友從森林散步回來，為什麼讓她感到驚訝？",["朋友說沒看到特別的東西","朋友迷路了","朋友沒有帶相機"],[0]],["海倫主要用哪一種感覺發現樹枝、流水和草地？",["觸覺","味覺","視覺"],[0]],["她摸到樹枝時，可以感受到什麼？",["春天的蓓蕾","冰冷的雪","海浪"],[0]],["「視而不見」在課文中較接近什麼意思？",["看得到卻沒有留心","眼睛完全看不到","故意閉上眼睛"],[0]],["海倫如果得到三天光明，最想做什麼？",["盡力看看這個世界","一直睡覺","躲在家裡"],[0]],["這篇文章最想提醒我們什麼？",["珍惜平常擁有的感官與生活","只有看見才有快樂","森林裡沒有特別的東西"],[0]]],"vocab":[["學業","學習的課業。"],["勵志","激勵人奮發向上的心志。"],["寧靜","安靜、平和。"],["視力","眼睛辨識事物的能力。"],["注意","關注、留意。"],["任何","無論什麼。"],["地毯","鋪在地面上的毯子。"],["舒適","舒服、安適。"],["五彩繽紛","形容色彩繁多、鮮豔絢麗。"],["盡力","用最大的力量去做。"]]}};
const n=Number(new URLSearchParams(location.search).get("lesson")||2),data=LESSONS[n]||LESSONS[2];
function reorder(opts,ans,seed){const ps={3:[[1,0,2],[2,1,0],[0,2,1]],4:[[2,0,3,1],[1,3,0,2],[3,1,2,0],[0,2,1,3]]},ord=ps[opts.length][seed%ps[opts.length].length],no=ord.map(i=>opts[i]),ct=ans.map(i=>opts[i]);return [no,ct.map(t=>no.indexOf(t))]}
const quizData=[];data.reading.forEach((x,i)=>{const z=reorder(x[1],x[2],i);quizData.push({part:"第一部分｜課文理解",q:x[0],options:z[0],answers:z[1],multi:z[1].length>1})});const words=data.vocab.map(x=>x[0]);data.vocab.forEach((x,j)=>{let wrong=[],k=1;while(wrong.length<2){const c=words[(j+k*3)%words.length];if(c!==x[0]&&!wrong.includes(c))wrong.push(c);k++}const z=reorder([x[0],...wrong],[0],j+7);quizData.push({part:"第二部分｜語詞理解",q:`哪一個語詞的意思是：「${x[1]}」`,options:z[0],answers:z[1],multi:false})});
document.getElementById("title").textContent=`第${n}課　${data.title}`;document.title=`第${n}課 ${data.title}｜語音互動複習`;document.getElementById("total").textContent=`共 ${quizData.length} 題`;document.getElementById("rc").textContent=`課文理解 ${data.reading.length} 題`;document.getElementById("vc").textContent=`語詞理解 ${data.vocab.length} 題`;
let current=0,score=0,answered=false,selected=[];function speak(text){text=text.replaceAll('馬偕','馬接');if(!("speechSynthesis" in window)){alert("這個瀏覽器目前不支援語音播放，建議使用 Chrome 或 Edge。");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="zh-TW";u.rate=.82;const vs=speechSynthesis.getVoices(),tw=vs.find(v=>/zh-TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang));if(tw)u.voice=tw;speechSynthesis.speak(u)}function startQuiz(){intro.style.display="none";quiz.style.display="block";current=0;score=0;render()}function render(){answered=false;selected=[];const item=quizData[current];part.textContent=item.part;qnum.textContent=`第 ${current+1} 題／共 ${quizData.length} 題`;question.textContent=item.q;hint.style.display=item.multi?"inline-block":"none";speakQ.onclick=()=>speak(item.q+(item.multi?"，本題可以複選。":""));feedback.textContent="";checkBtn.style.display="inline-block";nextBtn.style.display="none";nextBtn.textContent=current===quizData.length-1?"看成績":"下一題";bar.style.width=`${current/quizData.length*100}%`;options.innerHTML="";item.options.forEach((opt,idx)=>{const row=document.createElement("div");row.className="opt";const choose=document.createElement("button");choose.className="optbutton";choose.textContent=`${String.fromCharCode(65+idx)}．${opt}`;choose.onclick=()=>toggleAnswer(idx,row,item.multi);const audio=document.createElement("button");audio.className="speak";audio.textContent="🔊";audio.onclick=e=>{e.stopPropagation();speak(opt)};row.append(choose,audio);options.append(row)});setTimeout(()=>speak(item.q+(item.multi?"，本題可以複選。":"")),300)}function toggleAnswer(idx,row,multi){if(answered)return;if(multi){if(selected.includes(idx)){selected=selected.filter(x=>x!==idx);row.classList.remove("selected")}else{selected.push(idx);row.classList.add("selected")}}else{selected=[idx];document.querySelectorAll(".opt").forEach(r=>r.classList.remove("selected"));row.classList.add("selected")}}function same(a,b){const x=[...a].sort((m,n)=>m-n),y=[...b].sort((m,n)=>m-n);return x.length===y.length&&x.every((v,i)=>v===y[i])}function checkAnswer(){if(answered)return;if(!selected.length){feedback.textContent="請先選一個答案喔！";speak("請先選一個答案喔。");return}answered=true;const item=quizData[current],rows=[...document.querySelectorAll(".opt")],ok=same(selected,item.answers);rows.forEach((r,i)=>{if(item.answers.includes(i))r.classList.add("correct");else if(selected.includes(i))r.classList.add("wrong")});if(ok){score++;feedback.textContent="答對了！很棒！";speak("答對了，很棒！")}else{const t=item.answers.map(i=>item.options[i]).join("、");feedback.textContent=`正確答案是：${t}`;speak(`正確答案是，${t}`)}checkBtn.style.display="none";nextBtn.style.display="inline-block"}function nextQuestion(){if(current<quizData.length-1){current++;render()}else finish()}function finish(){quiz.style.display="none";result.style.display="block";bar.style.width="100%";document.getElementById("score").textContent=`${score}／${quizData.length} 題`;speak(`完成了。你答對 ${score} 題，總共有 ${quizData.length} 題。`)}function restartQuiz(){result.style.display="none";quiz.style.display="block";current=0;score=0;render()}
</script></body></html>
